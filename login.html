<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户登录 - 专利主IPC分类系统</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <button class="theme-toggle" id="themeToggle">
        <i class="fas fa-moon"></i>
    </button>

    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-logo">
                    <i class="fas fa-paper-plane"></i>
                </div>
                <h1 class="auth-title">专利主IPC分类系统</h1>
                <p class="auth-subtitle">智能专利分类，高效便捷</p>
            </div>

            <div class="auth-tabs">
                <button class="auth-tab active" data-tab="login">登录</button>
                <button class="auth-tab" data-tab="register">注册</button>
            </div>

            <div class="auth-body">
                <!-- 登录表单 -->
                <form class="auth-form active" id="loginForm">
                    <div class="message-box" id="loginMessage">
                        <i class="fas fa-info-circle"></i>
                        <span></span>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="loginIdentifier">用户名 / 邮箱</label>
                        <div class="input-wrapper">
                            <i class="fas fa-user"></i>
                            <input type="text" class="form-input" id="loginIdentifier" placeholder="请输入用户名或邮箱" autocomplete="username">
                        </div>
                        <div class="error-message" id="loginIdentifierError"></div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="loginPassword">密码</label>
                        <div class="input-wrapper">
                            <i class="fas fa-lock"></i>
                            <input type="password" class="form-input" id="loginPassword" placeholder="请输入密码" autocomplete="current-password">
                            <button type="button" class="password-toggle" data-target="loginPassword">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                        <div class="error-message" id="loginPasswordError"></div>
                    </div>

                    <div class="remember-me">
                        <input type="checkbox" id="rememberMe">
                        <label for="rememberMe">记住我</label>
                    </div>

                    <button type="submit" class="btn btn-primary" id="loginBtn">
                        <i class="fas fa-sign-in-alt"></i>
                        登录
                    </button>
                </form>

                <!-- 注册表单 -->
                <form class="auth-form" id="registerForm">
                    <div class="message-box" id="registerMessage">
                        <i class="fas fa-info-circle"></i>
                        <span></span>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="registerUsername">用户名</label>
                        <div class="input-wrapper">
                            <i class="fas fa-user"></i>
                            <input type="text" class="form-input" id="registerUsername" placeholder="请输入用户名（3-20个字符）" autocomplete="username">
                        </div>
                        <div class="error-message" id="registerUsernameError"></div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="registerEmail">邮箱</label>
                        <div class="input-wrapper">
                            <i class="fas fa-envelope"></i>
                            <input type="email" class="form-input" id="registerEmail" placeholder="请输入邮箱地址" autocomplete="email">
                        </div>
                        <div class="error-message" id="registerEmailError"></div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="registerPassword">密码</label>
                        <div class="input-wrapper">
                            <i class="fas fa-lock"></i>
                            <input type="password" class="form-input" id="registerPassword" placeholder="请输入密码（至少6个字符）" autocomplete="new-password">
                            <button type="button" class="password-toggle" data-target="registerPassword">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                        <div class="password-strength" id="passwordStrength" style="display: none;">
                            <div class="strength-bars">
                                <div class="strength-bar" id="strengthBar1"></div>
                                <div class="strength-bar" id="strengthBar2"></div>
                                <div class="strength-bar" id="strengthBar3"></div>
                                <div class="strength-bar" id="strengthBar4"></div>
                            </div>
                            <div class="strength-text" id="strengthText">
                                <i class="fas fa-info-circle"></i>
                                <span>密码强度</span>
                            </div>
                            <div class="strength-requirements">
                                <div class="requirement" id="reqLength">
                                    <i class="fas fa-circle"></i>
                                    <span>至少6个字符</span>
                                </div>
                                <div class="requirement" id="reqLower">
                                    <i class="fas fa-circle"></i>
                                    <span>包含小写字母</span>
                                </div>
                                <div class="requirement" id="reqUpper">
                                    <i class="fas fa-circle"></i>
                                    <span>包含大写字母</span>
                                </div>
                                <div class="requirement" id="reqNumber">
                                    <i class="fas fa-circle"></i>
                                    <span>包含数字</span>
                                </div>
                                <div class="requirement" id="reqSpecial">
                                    <i class="fas fa-circle"></i>
                                    <span>包含特殊字符 (!@#$%^&*)</span>
                                </div>
                            </div>
                        </div>
                        <div class="error-message" id="registerPasswordError"></div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="registerConfirmPassword">确认密码</label>
                        <div class="input-wrapper">
                            <i class="fas fa-lock"></i>
                            <input type="password" class="form-input" id="registerConfirmPassword" placeholder="请再次输入密码" autocomplete="new-password">
                            <button type="button" class="password-toggle" data-target="registerConfirmPassword">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                        <div class="error-message" id="registerConfirmPasswordError"></div>
                    </div>

                    <button type="submit" class="btn btn-primary" id="registerBtn">
                        <i class="fas fa-user-plus"></i>
                        注册
                    </button>
                </form>
            </div>

            <div class="auth-footer">
                <small style="color: var(--text-secondary);">© 2026 专利主IPC分类系统</small>
            </div>
        </div>
    </div>

    <script src="login.js"></script>
</body>
</html>
